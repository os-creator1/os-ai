name: Google Business Profile Focused Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/Library/GoogleBusinessProfile/**'
      - 'app/Library/GoogleBusinessProfilePerformance/**'
      - 'app/Http/Controllers/Customer/Business/GoogleBusinessProfileController.php'
      - 'resources/views/customer/business/googleBusinessProfile/**'
      - 'tests/Feature/GoogleBusinessProfile/**'
      - 'tests/Feature/Security/GoogleBusinessProfileSecurityTest.php'
      - 'config/google_business_profile.php'
      - '.github/workflows/gbp-focused-tests.yml'

permissions:
  contents: read

concurrency:
  group: gbp-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gbp-regression:
    name: Google Business Profile (PHP + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: ultimatesms_testing
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Choose-A-Local-Test-Password
      EXPECTED_TEST_DATABASE: ultimatesms_testing
      QUEUE_CONNECTION: sync
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Choose-A-Local-Test-Password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      # RefreshDatabase bootstraps TestDatabaseSafety before any migration writes.
      # Never run artisan migrate directly before that guard.
      - name: Run focused Google Business Profile tests
        run: >-
          php artisan test
          tests/Feature/GoogleBusinessProfile/GoogleBusinessProfileOverviewRedesignTest.php
          tests/Feature/GoogleBusinessProfile/GoogleBusinessProfileSettingsDesignTest.php
          tests/Feature/GoogleBusinessProfile/GoogleBusinessProfileCustomerAcceptanceTest.php
          tests/Feature/GoogleBusinessProfile/GoogleBusinessProfileMultiLocationTest.php
          tests/Feature/GoogleBusinessProfile/GoogleBusinessProfileReadOnlyTest.php
          tests/Feature/GoogleBusinessProfile/GoogleBusinessProfileMirrorRetentionTest.php
          tests/Feature/GoogleBusinessProfile/GoogleBusinessProfilePerformanceTest.php
          tests/Feature/GoogleBusinessProfile/GoogleBusinessProfilePrivacyTest.php
          tests/Feature/GoogleBusinessProfile/GoogleBusinessProfileTenancyTest.php
          tests/Feature/GoogleBusinessProfile/GoogleBusinessProfileBindingTest.php
          tests/Feature/Security/GoogleBusinessProfileSecurityTest.php
