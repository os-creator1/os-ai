name: Website Funnel Analytics

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Library/WebsiteAnalytics/**'
      - 'app/Models/WebsiteAnalytics*.php'
      - 'app/Http/Controllers/Public/WebsiteAnalyticsCollectController.php'
      - 'app/Http/Controllers/Customer/Agency/AgencyWebsiteAnalyticsController.php'
      - 'app/Http/Controllers/Customer/Business/WebsiteAnalyticsController.php'
      - 'app/Http/Controllers/Customer/PublicBookingController.php'
      - 'app/Http/View/Composers/WebsitePageComposer.php'
      - 'app/Library/AgencyOutreach/OutreachScriptRenderer.php'
      - 'app/Library/AgencyProspecting/AgencyProspectMessageTemplate.php'
      - 'app/Library/Website/Tracking/WebsiteTrackingSettings.php'
      - 'database/migrations/*website_analytics*'
      - 'public/js/website-analytics.js'
      - 'public/js/website-tracking.js'
      - 'resources/views/customer/website-analytics/**'
      - 'resources/views/customer/agency/white-label/**'
      - 'resources/views/public/analytics/**'
      - 'app/Http/Middleware/VerifyCsrfToken.php'
      - 'app/Http/Controllers/Public/AgencySiteController.php'
      - 'app/Library/AgencySite/SiteRenderer.php'
      - 'app/Jobs/AgencyProspecting*.php'
      - 'app/Jobs/Outreach/**'
      - 'routes/public.php'
      - 'routes/customer.php'
      - 'resources/views/marketing/layout.blade.php'
      - 'resources/views/public/booking/show.blade.php'
      - 'resources/views/public/website/page.blade.php'
      - 'resources/views/customer/business/website/**'
      - 'tests/Feature/WebsiteAnalytics/**'
      - '.github/workflows/website-funnel-analytics-tests.yml'

permissions:
  contents: read

concurrency:
  group: website-funnel-analytics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  funnel-analytics:
    name: Native website funnel analytics (PHP + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ultimatesms_testing
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Choose-A-Local-Test-Password
      EXPECTED_TEST_DATABASE: ultimatesms_testing
      QUEUE_CONNECTION: sync
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Choose-A-Local-Test-Password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Test Agency and Growth funnel analytics end to end
        run: |
          set -o pipefail
          php artisan test tests/Feature/WebsiteAnalytics --stop-on-failure | tee test-output.txt
          # A zero-test success is a failure.
          grep -Eq 'Tests:[[:space:]]+.*[1-9][0-9]* passed' test-output.txt
      - name: Test the existing consumers of the shared seams (tracking, SMS rendering, booking, landing page)
        run: |
          set -o pipefail
          php artisan test tests/Feature/Website/Tracking tests/Feature/Marketing/PhotoBoothAgencyLandingTest.php tests/Feature/AgencyOutreach/OutreachCompanyTokenTest.php tests/Feature/Calendar/PublicSchedulerAcceptanceTest.php --stop-on-failure | tee test-output-existing.txt
          grep -Eq 'Tests:[[:space:]]+.*[1-9][0-9]* passed' test-output-existing.txt
