name: AI Subscription Contract Autostart

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ai-subscription-contract-autostart-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  start-locked-contract:
    name: Start a human-merged locked contract
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out trusted default-branch automation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Self-test the trusted control plane
        run: |
          node .github/scripts/ai_subscription_autostart.js --selftest
          node .github/scripts/ai_subscription_labels.js --selftest
          node .github/scripts/ai_subscription_gate.js --selftest
          node .github/scripts/fire_claude_routine.js --selftest
          node .github/scripts/ai_subscription_gate.js validate-state \
            --state docs/automation/AI-AUTONOMY-STATE.json

      - name: Authorize this merged contract and its exact target
        id: authorize
        uses: actions/github-script@v8
        with:
          script: |
            const authorize = require('./.github/scripts/ai_subscription_autostart.js').authorize;
            const result = await authorize({ github, context, core });
            core.setOutput('status', result.status);
            core.setOutput('target_pr', String(result.targetPrNumber ?? ''));
            core.setOutput('contract_path', result.contractPath ?? '');

      - name: Apply the trusted implementation lease and label
        id: control
        if: steps.authorize.outputs.status == 'authorized'
        uses: actions/github-script@v8
        env:
          CONTROL_COMMAND: start
          CONTROL_PR_NUMBER: ${{ steps.authorize.outputs.target_pr }}
          CONTRACT_PATH: ${{ steps.authorize.outputs.contract_path }}
        with:
          script: |
            const control = require('./.github/scripts/ai_subscription_labels.js');
            const result = await control({ github, context, core });
            core.setOutput('pr_number', String(result.prNumber ?? ''));
            core.setOutput('status', result.status ?? 'unknown');
            core.setOutput('transition', result.transition ?? '');

            await core.summary
              .addHeading('Automatic subscription-loop start')
              .addTable([
                [{ data: 'Field', header: true }, { data: 'Value', header: true }],
                ['Merged contract', `#${context.payload.pull_request.number}`],
                ['Contract path', process.env.CONTRACT_PATH],
                ['Implementation PR', String(result.prNumber ?? 'n/a')],
                ['Transition', result.transition ?? 'none'],
              ])
              .write();

      - name: Fire the Claude subscription Routine
        if: steps.control.outputs.status == 'transitioned' && contains(steps.control.outputs.transition, '->ai:implement')
        env:
          CLAUDE_ROUTINE_URL: ${{ secrets.CLAUDE_ROUTINE_URL }}
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
        run: node .github/scripts/fire_claude_routine.js

      - name: Stop safely when the Claude Routine cannot start
        if: failure() && steps.control.outputs.status == 'transitioned' && contains(steps.control.outputs.transition, '->ai:implement')
        uses: actions/github-script@v8
        env:
          CONTROL_PR_NUMBER: ${{ steps.control.outputs.pr_number }}
        with:
          script: |
            const prNumber = Number(process.env.CONTROL_PR_NUMBER);
            for (const label of [
              'ai:implement', 'ai:testing', 'ai:awaiting-codex',
              'ai:codex-reviewed', 'ai:ready-for-human',
            ]) {
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: prNumber,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: prNumber,
              labels: ['ai:needs-human'],
            });
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: prNumber,
              body: [
                '[AI-SUBSCRIPTION-LOOP NEEDS HUMAN]',
                'The human-merged contract was authorized and labeled, but the Claude subscription Routine did not start.',
                `Evidence: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                'No correction, merge, push to main, or tag was started.',
              ].join('\n'),
            });
