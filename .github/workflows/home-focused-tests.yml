name: Home Focused Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Library/Dashboard/Home/**'
      - 'app/Library/Dashboard/BusinessHomePresenter.php'
      - 'app/Library/Growth/GrowthHomeBand.php'
      - 'app/Library/Growth/GrowthOpportunityReader.php'
      - 'app/Http/Controllers/Customer/Business/SeoAuditController.php'
      - 'app/Http/Controllers/Customer/Business/WebsiteController.php'
      - 'app/Library/Website/WebsiteMetaDescriptionSuggester.php'
      - 'routes/customer.php'
      - 'resources/views/customer/business/seo/audit.blade.php'
      - 'resources/views/customer/business/website/page-form.blade.php'
      - 'resources/views/customer/dashboard/home/**'
      - 'tests/Feature/Dashboards/**'
      - 'app/Library/Seo/Rank/SeoRankHistoryReader.php'
      - 'tests/Feature/Seo/Rank/Concerns/**'
      - 'tests/Unit/Growth/GrowthHomeBandSeoHeadTest.php'
      - 'tests/Feature/Growth/GrowthHomeBandSeoCoverageTest.php'
      - 'tests/Feature/Seo/SeoAuditDraftFixLinkTest.php'
      - 'tests/Feature/Website/WebsiteMetaDescriptionSuggestionTest.php'
      - '.github/workflows/home-focused-tests.yml'

permissions:
  contents: read

concurrency:
  group: home-focused-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  home-regression:
    name: Home + Website SEO AI (PHP + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: ultimatesms_testing
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Choose-A-Local-Test-Password
      EXPECTED_TEST_DATABASE: ultimatesms_testing
      QUEUE_CONNECTION: sync
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Choose-A-Local-Test-Password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      # RefreshDatabase bootstraps TestDatabaseSafety before any migration writes.
      # Never run artisan migrate directly before that guard.
      - name: Run focused Home and SEO-priority tests
        run: php artisan test tests/Feature/Dashboards/HomeCommandCenterTest.php tests/Feature/Dashboards/GrowthHomeUnifiedTest.php tests/Feature/Dashboards/GrowthHomeSeoActivationTest.php tests/Feature/Dashboards/HomeGoogleVisibilityTest.php tests/Feature/Dashboards/RecentWorkSeoActivityTest.php tests/Feature/Dashboards/RecentWorkAutomationOutcomesTest.php tests/Feature/Dashboards/BusinessHomeRecentWorkTest.php tests/Feature/Dashboards/DashboardQueryBudgetTest.php tests/Feature/Dashboards/GrowthHomeExperienceTest.php tests/Feature/Dashboards/GrowthHomeAcceptanceTest.php tests/Feature/Dashboards/GrowthHomeEvidenceTest.php tests/Feature/Dashboards/HomeV2ExperienceTest.php tests/Feature/Dashboards/HomeV2FollowUpFixesTest.php tests/Unit/Growth/GrowthHomeBandSeoHeadTest.php tests/Feature/Growth/GrowthHomeBandSeoCoverageTest.php tests/Feature/Seo/SeoAuditDraftFixLinkTest.php tests/Feature/Website/WebsiteMetaDescriptionSuggestionTest.php --stop-on-failure
