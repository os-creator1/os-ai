name: Home Focused Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Library/Dashboard/Home/**'
      - 'app/Library/Dashboard/BusinessHomePresenter.php'
      - 'app/Library/Opportunity/**'
      - 'app/Http/Controllers/Customer/OpportunityController.php'
      - 'resources/views/customer/opportunities/**'
      - 'tests/Feature/Opportunity/**'
      - 'tests/Unit/Opportunity/**'
      - 'app/Library/Growth/GrowthHomeBand.php'
      - 'app/Library/Growth/GrowthWorkStage.php'
      - 'app/Http/Controllers/Customer/Business/GrowthCenterController.php'
      - 'resources/views/customer/business/growth/**'
      - 'tests/Feature/Growth/GrowthWorkHistoryTest.php'
      - 'tests/Unit/Growth/GrowthWorkStageTest.php'
      - 'app/Library/Growth/GrowthOpportunityReader.php'
      - 'app/Http/Controllers/Customer/Business/SeoAuditController.php'
      - 'app/Http/Controllers/Customer/Business/WebsiteController.php'
      - 'app/Library/Website/WebsiteMetaDescriptionSuggester.php'
      - 'routes/customer.php'
      - 'resources/views/customer/business/seo/audit.blade.php'
      - 'resources/views/customer/business/website/page-form.blade.php'
      - 'resources/views/customer/dashboard/home/**'
      - 'public/js/home/**'
      - 'tests/Feature/Dashboards/**'
      - 'app/Library/Conversations/BusinessConversationReadModel.php'
      - 'tests/Feature/Conversations/BusinessConversationReadModelTest.php'
      - 'app/Library/Seo/Rank/SeoRankHistoryReader.php'
      - 'tests/Feature/Seo/Rank/Concerns/**'
      - 'tests/Unit/Growth/GrowthHomeBandSeoHeadTest.php'
      - 'tests/Feature/Growth/GrowthHomeBandSeoCoverageTest.php'
      - 'tests/Feature/Seo/SeoAuditDraftFixLinkTest.php'
      - 'tests/Feature/Website/SeoMetaFixPublishFlowTest.php'
      - 'tests/Feature/Website/SeoTitleFixApprovalTest.php'
      - 'tests/Feature/Website/SeoDescriptionFixApprovalTest.php'
      - 'tests/Feature/Website/SeoShortDescriptionFixApprovalTest.php'
      - 'tests/Feature/Website/SeoMetadataOptimizationTest.php'
      - 'app/Library/Seo/SeoMetadataRules.php'
      - 'app/Library/Seo/SeoTitleProposal.php'
      - 'app/Http/Controllers/Customer/Business/SeoAuditController.php'
      - 'tests/Feature/Website/WebsiteMetaDescriptionSuggestionTest.php'
      - 'resources/views/errors/**'
      - 'resources/views/components/error-page.blade.php'
      - 'app/Library/ErrorPages/**'
      - 'app/Exceptions/Handler.php'
      - 'app/Http/Controllers/MaintenanceNotifyController.php'
      - 'app/Http/Controllers/Auth/LoginController.php'
      - 'routes/auth.php'
      - 'routes/web.php'
      - 'resources/views/customer/account-locked.blade.php'
      - 'resources/views/offers/show.blade.php'
      - 'resources/lang/en/locale.php'
      - 'tests/Feature/ErrorPages/**'
      - 'tests/Feature/Security/JsonExceptionStatusTest.php'
      - 'tests/Feature/Security/JsonServerErrorSanitizationTest.php'
      - 'tests/Feature/Entitlement/CustomerAccountAccessGateTest.php'
      - 'tests/Feature/PlatformBilling/V1SignupFinalAcceptanceTest.php'
      - 'tests/Feature/PlatformBilling/V1SignupOnboardingHandoffTest.php'
      - 'tests/Feature/Navigation/TopBarAccountMenuTest.php'
      - 'tests/Feature/Workspace/ViewAsClientTest.php'
      - 'tests/Feature/Agency/AgencyWhiteLabelTest.php'
      - '.github/workflows/home-focused-tests.yml'

permissions:
  contents: read

concurrency:
  group: home-focused-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  home-regression:
    name: Home + Website SEO AI (PHP + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: ultimatesms_testing
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Choose-A-Local-Test-Password
      EXPECTED_TEST_DATABASE: ultimatesms_testing
      QUEUE_CONNECTION: sync
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Choose-A-Local-Test-Password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      # RefreshDatabase bootstraps TestDatabaseSafety before any migration writes.
      # Never run artisan migrate directly before that guard.
      - name: Run focused Home and SEO-priority tests
        run: php artisan test tests/Unit/Growth/GrowthWorkStageTest.php tests/Feature/Growth/GrowthWorkHistoryTest.php tests/Feature/Opportunity/OpportunityProfileActionExecutorTest.php tests/Feature/Opportunity/OpportunityActionExecutorTest.php tests/Unit/Opportunity/OpportunityActionRegistryTest.php tests/Feature/Opportunity/OpportunityMutationHttpTest.php tests/Feature/Opportunity/OpportunityProfileActionsHttpTest.php tests/Feature/Dashboards/HomeCommandCenterTest.php tests/Feature/Conversations/BusinessConversationReadModelTest.php tests/Feature/Dashboards/GrowthHomeUnifiedTest.php tests/Feature/Dashboards/GrowthHomeSeoActivationTest.php tests/Feature/Dashboards/GrowthHomeLeadResponseTest.php tests/Feature/Dashboards/GrowthHomeLeadRecoveryTest.php tests/Feature/Dashboards/GrowthHomeLeadRecoveryPrivacyTest.php tests/Feature/Dashboards/GrowthHomeBookingEvidenceTest.php tests/Feature/Dashboards/HomeGoogleVisibilityTest.php tests/Feature/Dashboards/RecentWorkSeoActivityTest.php tests/Feature/Dashboards/RecentWorkAutomationOutcomesTest.php tests/Feature/Dashboards/BusinessHomeRecentWorkTest.php tests/Feature/Dashboards/DashboardQueryBudgetTest.php tests/Feature/Dashboards/GrowthHomeExperienceTest.php tests/Feature/Dashboards/GrowthHomeAcceptanceTest.php tests/Feature/Dashboards/GrowthHomeEvidenceTest.php tests/Feature/Dashboards/HomeV2ExperienceTest.php tests/Feature/Dashboards/HomeV2FollowUpFixesTest.php tests/Feature/Assistant/AssistantHomeUiTest.php tests/Unit/Growth/GrowthHomeBandSeoHeadTest.php tests/Feature/Growth/GrowthHomeBandSeoCoverageTest.php tests/Feature/Seo/SeoAuditDraftFixLinkTest.php tests/Feature/Website/SeoMetaFixPublishFlowTest.php tests/Feature/Website/SeoTitleFixApprovalTest.php tests/Feature/Website/SeoDescriptionFixApprovalTest.php tests/Feature/Website/SeoShortDescriptionFixApprovalTest.php tests/Feature/Website/SeoMetadataOptimizationTest.php tests/Unit/Seo/SeoMetadataRulesTest.php tests/Unit/Seo/SeoTitleProposalTest.php tests/Feature/Website/WebsiteMetaDescriptionSuggestionTest.php --stop-on-failure
      - name: Run inline description proposal and recommendation-navigation tests
        run: php artisan test tests/Feature/Dashboards/HomeDescriptionProposalTest.php tests/Feature/Opportunity/RecommendationsUxTest.php tests/Feature/Dashboards/GrowthHomeVariantBTest.php tests/Feature/Dashboards/GrowthHomeActionRoutingTest.php
      - name: Run focused error-page, auth and security tests
        run: php artisan test tests/Feature/ErrorPages/UnifiedErrorPagesTest.php tests/Feature/ErrorPages/UniversalErrorPageTest.php tests/Feature/ErrorPages/MaintenanceNotifyErrorPageTest.php tests/Feature/ErrorPages/ErrorPageSecurityAndBrandingTest.php tests/Feature/Security/JsonExceptionStatusTest.php tests/Feature/Security/JsonServerErrorSanitizationTest.php tests/Feature/Entitlement/CustomerAccountAccessGateTest.php tests/Feature/Workspace/ViewAsClientTest.php tests/Feature/PlatformBilling/V1SignupFinalAcceptanceTest.php tests/Feature/PlatformBilling/V1SignupOnboardingHandoffTest.php tests/Feature/Agency/AgencyWhiteLabelTest.php
      # TopBarAccountMenuTest::test_the_unread_dot_follows_the_real_unread_state fails independently of this change
      # (the bell reads DocumentActivityCenterReader, not legacy Notifications rows); only the sign-out test is relevant here.
      - name: Run sign-out menu test
        run: php artisan test tests/Feature/Navigation/TopBarAccountMenuTest.php --filter test_sign_out_posts
