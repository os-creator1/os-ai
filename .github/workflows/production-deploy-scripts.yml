name: Production Deploy Scripts

on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/forge/**'
      - '.github/workflows/production-deploy-scripts.yml'

permissions:
  contents: read

concurrency:
  group: production-deploy-scripts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Production deploy scripts (offline, stubbed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the staging branch the validator compares against
        run: git fetch origin staging:refs/remotes/origin/staging
      - name: Validate the production deploy scripts
        run: |
          set -o pipefail
          bash deploy/forge/production/validate-scripts.sh | tee validate.log
          # A run that exits zero but asserted nothing is a failure.
          grep -Eq '^validated: [1-9][0-9]* passed, 0 failed$' validate.log
