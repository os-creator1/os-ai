name: Temporary Email Verification

on:
  push:
    branches:
      - verify/email-verification-fix

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: ultimatesms_testing
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Choose-A-Local-Test-Password
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Choose-A-Local-Test-Password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, pdo_mysql, intl, xml, curl, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Diff check and PHP lint
        run: |
          git diff --check origin/staging...HEAD
          for f in $(git diff --name-only origin/staging...HEAD | grep '\.php$' | grep -v '\.blade\.php$'); do php -l "$f" >/dev/null; done
      - name: Prepare disposable test database once
        run: |
          [ "$DB_DATABASE" = "ultimatesms_testing" ] && [ "$DB_HOST" = "127.0.0.1" ]
          php artisan config:clear
          php artisan migrate --force
      - name: Verification routes exist with registration disabled
        run: |
          ACCOUNT_CAN_REGISTER=false php artisan route:list --name=verification | tee routes.txt
          grep -q verification.verify routes.txt && grep -q verification.notice routes.txt && grep -q verification.send routes.txt
      - name: Focused tests (sequential)
        run: |
          php vendor/bin/phpunit --no-coverage \
            tests/Feature/Auth/EmailVerificationContinuationTest.php \
            tests/Feature/PlatformBilling/V1SignupHttpTest.php \
            tests/Feature/PlatformBilling/PrivateOfferRedemptionTest.php
