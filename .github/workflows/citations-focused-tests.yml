name: Citations Focused Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Library/Seo/SeoCitation*'
      - 'app/Http/Controllers/Customer/Business/SeoCitationController.php'
      - 'resources/views/customer/business/seo/_citation*'
      - 'resources/views/customer/business/seo/citations.blade.php'
      - 'tests/Feature/Seo/SeoCitation*'
      - '.github/workflows/citations-focused-tests.yml'

permissions:
  contents: read

concurrency:
  group: citations-focused-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  citation-regression:
    name: Citations (PHP + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: ultimatesms_testing
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Choose-A-Local-Test-Password
      EXPECTED_TEST_DATABASE: ultimatesms_testing
      QUEUE_CONNECTION: sync
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Choose-A-Local-Test-Password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Compile Blade views
        run: php artisan view:cache
      # RefreshDatabase runs TestDatabaseSafety before any migration writes.
      # Never run artisan migrate directly before that guard.
      - name: Run Citations feature tests
        run: >-
          php artisan test
          tests/Feature/Seo/SeoCitationsNextActionTest.php
          tests/Feature/Seo/SeoCitationsDashboardTest.php
          tests/Feature/Seo/SeoCitationsV1Test.php
          tests/Feature/Seo/SeoCitationsBoundaryTest.php
          tests/Feature/Seo/SeoCitationsAuditRepairTest.php
          tests/Feature/Seo/SeoCitationsCountryScopeTest.php
          tests/Feature/Seo/SeoCitationsReachabilityTest.php
          tests/Feature/Seo/SeoCitationBlueprintSyncTest.php
          tests/Feature/Seo/SeoCitationsTest.php
          tests/Feature/Seo/SeoCitationsSchemaTest.php
