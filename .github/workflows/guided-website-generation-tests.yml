name: Guided Website Generation Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Library/Website/**'
      - 'tests/Feature/Website/**'
      - 'tests/Feature/Seo/Content/PublicBlogTest.php'
      - 'app/Http/Controllers/Customer/Business/WebsiteController.php'
      - 'app/Http/Controllers/Customer/Business/WebsiteStudioController.php'
      - 'database/seeders/WebsiteTemplateSeeder.php'
      - 'public/css/website-design.css'
      - 'resources/views/public/website/**'
      - 'database/seeders/TutoringWebsiteSetupQuestionnaireSeeder.php'
      - 'app/Console/Commands/SeedNicheBlueprintCommand.php'
      - 'app/Console/Commands/RepairPhotoBoothBlueprintCommand.php'
      - 'app/Library/NicheBlueprint/PhotoBoothBlueprintProvisioner.php'
      - 'app/Listeners/NicheBlueprint/**'
      - 'tests/Feature/NicheBlueprint/V2/PhotoBoothBlueprintProvisioningRepairTest.php'
      - '.github/workflows/guided-website-generation-tests.yml'

permissions:
  contents: read

concurrency:
  group: guided-website-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guided-generation:
    name: Guided generation (PHP 8.2 + MySQL 8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ultimatesms_testing
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Choose-A-Local-Test-Password
      EXPECTED_TEST_DATABASE: ultimatesms_testing
      QUEUE_CONNECTION: sync
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Choose-A-Local-Test-Password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify maximal questionnaire fits the per-batch AI input budget
        run: php artisan test tests/Feature/Website/WebsiteAiEnvelopeCaptureTest.php --filter=test_the_true_maximum_questionnaire_serializes_within_the_input_token_envelope
      - name: Run new multi-batch tests and enforce nonzero discovery
        shell: bash
        run: |
          php artisan test tests/Feature/Website/GuidedGeneration/BatchedGuidedGenerationTest.php --log-junit /tmp/batched-generation.xml
          php -r '$x = simplexml_load_file("/tmp/batched-generation.xml"); $n = count($x->xpath("//testcase")); fwrite(STDOUT, "Discovered batch tests: $n\n"); if ($n < 1) exit(1);'
      - name: Run Slice 3B technical local SEO tests and enforce discovery
        shell: bash
        run: |
          php artisan test tests/Feature/Website/TechnicalLocalSeoTest.php --log-junit /tmp/technical-local-seo.xml
          php -r '$x = simplexml_load_file("/tmp/technical-local-seo.xml"); $n = count($x->xpath("//testcase")); $s = count($x->xpath("//testcase/skipped")); fwrite(STDOUT, "Discovered technical SEO tests: $n (skipped: $s)\n"); if ($n !== 10 || $s !== 0) exit(1);'
      - name: Run Slice 3C niche-safe URL tests and enforce discovery
        shell: bash
        run: |
          php artisan test tests/Feature/Website/NicheSafeUrlsTest.php --log-junit /tmp/niche-safe-urls.xml
          php -r '$x = simplexml_load_file("/tmp/niche-safe-urls.xml"); $n = count($x->xpath("//testcase")); $s = count($x->xpath("//testcase/skipped")); fwrite(STDOUT, "Discovered niche-safe URL tests: $n (skipped: $s)\n"); if ($n !== 7 || $s !== 0) exit(1);'
      - name: Run Slice 4 generator acceptance tests and enforce discovery
        shell: bash
        run: |
          php artisan test tests/Feature/Website/GeneratorAcceptanceTest.php --log-junit /tmp/generator-acceptance.xml
          php -r '$x = simplexml_load_file("/tmp/generator-acceptance.xml"); $n = count($x->xpath("//testcase")); $s = count($x->xpath("//testcase/skipped")); fwrite(STDOUT, "Discovered acceptance tests: $n (skipped: $s)\n"); if ($n !== 17 || $s !== 0) exit(1);'
      - name: Run Slice 7 non-photo-booth niche acceptance and enforce discovery
        shell: bash
        run: |
          php artisan test tests/Feature/Website/Acceptance/NonPhotoBoothNicheAcceptanceTest.php --log-junit /tmp/niche-acceptance.xml
          php -r '$x = simplexml_load_file("/tmp/niche-acceptance.xml"); $n = count($x->xpath("//testcase")); $s = count($x->xpath("//testcase/skipped")); fwrite(STDOUT, "Discovered niche acceptance tests: $n (skipped: $s)\n"); if ($n !== 1 || $s !== 0) exit(1);'
      - name: Run Slice 8 Tutoring guided-setup acceptance and enforce discovery
        shell: bash
        run: |
          php artisan test tests/Feature/Website/Acceptance/TutoringGuidedSetupAcceptanceTest.php --log-junit /tmp/tutoring-guided.xml
          php -r '$x = simplexml_load_file("/tmp/tutoring-guided.xml"); $n = count($x->xpath("//testcase")); $s = count($x->xpath("//testcase/skipped")); fwrite(STDOUT, "Discovered Tutoring guided-setup tests: $n (skipped: $s)\n"); if ($n !== 4 || $s !== 0) exit(1);'
      - name: Run Photo Booth client Blueprint provisioning repair tests and enforce discovery
        shell: bash
        run: |
          php artisan test tests/Feature/NicheBlueprint/V2/PhotoBoothBlueprintProvisioningRepairTest.php --log-junit /tmp/pb-provisioning.xml
          php -r '$x = simplexml_load_file("/tmp/pb-provisioning.xml"); $n = count($x->xpath("//testcase")); $s = count($x->xpath("//testcase/skipped")); fwrite(STDOUT, "Discovered Photo Booth provisioning tests: $n (skipped: $s)\n"); if ($n !== 11 || $s !== 0) exit(1);'
      - name: Run generator recovery acceptance and enforce discovery
        shell: bash
        run: |
          php artisan test tests/Feature/Website/Acceptance/GeneratorRecoveryAcceptanceTest.php --log-junit /tmp/generator-recovery.xml
          php -r '$x = simplexml_load_file("/tmp/generator-recovery.xml"); $n = count($x->xpath("//testcase")); $s = count($x->xpath("//testcase/skipped")); fwrite(STDOUT, "Discovered generator recovery tests: $n (skipped: $s)\n"); if ($n !== 8 || $s !== 0) exit(1);'
      - name: Run Kaleb v3 visual-fidelity (Emerald Gold) acceptance and enforce discovery
        shell: bash
        run: |
          php artisan test tests/Feature/Website/Acceptance/KalebV3VisualFidelityAcceptanceTest.php --log-junit /tmp/kv3-fidelity.xml
          php -r '$x = simplexml_load_file("/tmp/kv3-fidelity.xml"); $n = count($x->xpath("//testcase")); $s = count($x->xpath("//testcase/skipped")); fwrite(STDOUT, "Discovered Emerald Gold acceptance tests: $n (skipped: $s)\n"); if ($n !== 6 || $s !== 0) exit(1);'
      - name: Run guided generation and affected page-budget regressions
        run: >-
          php artisan test
          tests/Feature/Website/GuidedGeneration
          tests/Unit/Website/PageContentQualityTest.php
          tests/Unit/Website/TrustFactsTest.php
          tests/Feature/Forms/FormsBoundaryTest.php
          tests/Feature/Website/WebsiteBoundaryTest.php
          tests/Feature/Website/InquiryPanelPhoneSnapshotTest.php
          tests/Feature/Website/FaqAndGuideLinksTest.php
          tests/Feature/Website/WebsitePageCountCeilingTest.php
          tests/Feature/Website/WebsitePlanExplanationTest.php
          tests/Feature/Website/WebsiteEventPagesPlanTest.php
          tests/Feature/Website/WebsitePageBudgetVisibilityTest.php
          tests/Feature/Website/WebsiteHealthTest.php
          tests/Feature/Website/WebsiteServiceAreaPagesTest.php
          tests/Feature/Website/WebsiteAiEnvelopeCaptureTest.php
          tests/Feature/Website/WebsiteGenerationAiEnvelopeTest.php
          tests/Feature/Website/Tracking
          tests/Feature/Website/WebsiteFormsModuleSeamTest.php
          tests/Feature/Seo/Content/PublicBlogTest.php
