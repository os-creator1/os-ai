name: Composer Lock Repair (temporary)

# TEMPORARY, one-off workflow. Its only purpose is to regenerate
# composer.lock against composer.json's Laravel 12 / PHPUnit 11
# constraints inside a real PHP 8.2 environment, because no such
# environment is available in the operator's local tooling. It exists
# only on fix/composer-lock-laravel12 and must be deleted (in its own
# follow-up commit) once composer.lock has been regenerated successfully
# -- it is not meant to survive into the PR against main.
#
# Triggered only by a push to fix/composer-lock-laravel12 that touches this
# workflow file itself (workflow_dispatch isn't usable here since GitHub
# only allows dispatching workflows that exist on the default branch, and
# this one intentionally does not). The path filter means the later
# composer.lock commit does not re-trigger it, and deleting this file in a
# follow-up commit removes it before that commit could trigger it either --
# there is no recursion. It is hardcoded to operate on
# fix/composer-lock-laravel12 alone, and pushes only composer.lock back to
# that same branch. It never touches main or feature/rfc-003-m3, never
# calls OpenAI or Anthropic, and never modifies composer.json (a hash
# check after `composer update` aborts the run if composer.json changed).

on:
  push:
    branches:
      - fix/composer-lock-laravel12
    paths:
      - .github/workflows/composer-lock-repair.yml

permissions:
  contents: write

concurrency:
  group: composer-lock-repair
  cancel-in-progress: false

jobs:
  regenerate-lock:
    # Belt-and-suspenders: this workflow file only exists on
    # fix/composer-lock-laravel12 in the first place, so it can only be
    # dispatched by selecting that branch -- this just makes the
    # restriction explicit and machine-checked too.
    if: github.ref == 'refs/heads/fix/composer-lock-laravel12'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Disposable, local-only, non-secret test configuration -- same
      # values already used by ai-orchestrator-pilot.yml. Not required by
      # `composer update`/`validate` themselves, but `composer install`
      # runs Laravel's package-discovery script, which boots the
      # framework's config layer, so these are present as a safety net.
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: ultimatesms_testing
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Choose-A-Local-Test-Password
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Choose-A-Local-Test-Password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout fix/composer-lock-laravel12
        uses: actions/checkout@v6
        with:
          ref: fix/composer-lock-laravel12
          fetch-depth: 0

      - name: Confirm checked-out branch
        run: |
          set -euo pipefail
          branch=$(git rev-parse --abbrev-ref HEAD)
          if [ "$branch" != "fix/composer-lock-laravel12" ]; then
            echo "::error::refusing to run outside fix/composer-lock-laravel12 (got: $branch)"
            exit 1
          fi

      - name: Record composer.json hash before touching dependencies
        id: before
        run: echo "hash=$(sha256sum composer.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Set up PHP 8.2 with the extensions composer.json requires
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: ctype, curl, dom, exif, fileinfo, gd, intl, json, libxml, mbstring, openssl, pcntl, pdo, pdo_mysql, posix, simplexml, zip
          coverage: none
          tools: composer:v2

      - name: composer update --with-all-dependencies (lock regeneration only)
        run: composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Confirm composer.json was not modified by the resolver
        run: |
          set -euo pipefail
          after="$(sha256sum composer.json | cut -d' ' -f1)"
          if [ "$after" != "${{ steps.before.outputs.hash }}" ]; then
            echo "::error::composer.json changed during 'composer update'; refusing to commit a lock that required constraint changes"
            git diff -- composer.json
            exit 1
          fi

      - name: composer validate (schema and lock consistency)
        run: composer validate --no-check-all

      - name: composer install (full, with scripts and package discovery)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Report resolved key package versions
        run: |
          composer show laravel/framework
          composer show phpunit/phpunit
          composer show laravel/sanctum
          composer show laravel/prompts

      - name: Confirm only composer.lock changed
        run: |
          set -euo pipefail
          changed="$(git status --porcelain)"
          echo "$changed"
          if [ -z "$changed" ]; then
            echo "::error::composer.lock did not change; nothing to commit"
            exit 1
          fi
          unexpected="$(echo "$changed" | awk '{print $2}' | grep -v '^composer\.lock$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected file(s) changed besides composer.lock: $unexpected"
            exit 1
          fi

      - name: Commit and push composer.lock
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "fix: synchronize Composer lock with Laravel 12 dependencies"
          git push origin HEAD:fix/composer-lock-laravel12
