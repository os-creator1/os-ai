name: ViewAs invitation accept check (temporary)

on:
  push:
    branches: [tmp/viewas-verify]

permissions:
  contents: read

jobs:
  growth-acceptance:
    name: ViewAs boundary + invitations (separate steps)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ultimatesms_testing
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Choose-A-Local-Test-Password
      EXPECTED_TEST_DATABASE: ultimatesms_testing
      QUEUE_CONNECTION: sync
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Choose-A-Local-Test-Password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: ViewAs boundary
        run: php artisan test tests/Feature/Security/ViewAsRouteBoundaryTest.php
      - name: Invitation tests (separate process)
        run: php artisan test tests/Feature/Workspace/WorkspaceMemberInvitationTest.php
