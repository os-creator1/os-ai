# Temporary isolated CI for PR #501. Remove before merge.
name: Temporary Demo Guest Notices QA (PR 501)
on:
  push:
    branches:
      - claude/demo-guest-emails-answers
permissions:
  contents: read
jobs:
  test:
    name: Demo guest emails with disposable MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_ENV: testing
      APP_URL: http://localhost
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: ultimatesms_testing_lane_demo501
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Disposable-Demo-501-Only
      EXPECTED_TEST_DATABASE: ultimatesms_testing_lane_demo501
      TARGET_DB: ultimatesms_testing_lane_demo501
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      CACHE_STORE: array
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing_lane_demo501
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Disposable-Demo-501-Only
          MYSQL_ROOT_PASSWORD: Disposable-Root-Demo-501
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert isolated environment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/claude/demo-guest-emails-answers"
          test "$APP_ENV" = "testing"
          test "$DB_HOST" = "127.0.0.1"
          test "$DB_DATABASE" = "ultimatesms_testing_lane_demo501"
          test "$EXPECTED_TEST_DATABASE" = "$DB_DATABASE"
          test "$TARGET_DB" = "$DB_DATABASE"
          test -z "${DATABASE_URL:-}"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, pdo_mysql, intl, xml, curl, zip, gd, exif, fileinfo
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify database safety guard
        run: php -r 'require "vendor/autoload.php"; Tests\Support\TestDatabaseSafety::assertSafeTestDatabaseName(getenv("DB_DATABASE"));'
      - name: Migrate disposable database
        run: |
          php artisan config:clear
          php artisan migrate --force
      - name: Focused booking notification and Zoom regressions
        shell: bash
        run: |
          set -euo pipefail
          php artisan test --no-ansi \
            tests/Feature/Calendar/DemoGuestChangeNoticesTest.php \
            tests/Feature/Calendar/DemoBookingTest.php \
            tests/Feature/Calendar/BookingNotificationsV2Test.php \
            tests/Feature/Calendar/Zoom/ZoomCalendarUiTest.php \
            | tee /tmp/demo501-tests.log
          grep -Eq 'Tests:[[:space:]]*[1-9][0-9]* passed|OK \([1-9][0-9]* tests?' /tmp/demo501-tests.log
