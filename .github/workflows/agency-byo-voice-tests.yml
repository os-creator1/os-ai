name: Agency BYO Voice Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Library/Voice/**'
      - 'app/Http/Controllers/Voice/**'
      - 'app/Http/Controllers/Customer/Business/VoiceCallController.php'
      - 'app/Http/Controllers/Customer/Workspace/AgencyVoiceSetupController.php'
      - 'app/Http/Controllers/Customer/Workspace/AgencyProspectingChannelController.php'
      - 'app/Models/AgencyProspectingChannel.php'
      - 'app/Models/BusinessVoiceCall.php'
      - 'database/migrations/2026_11_26_090000_add_byo_voice_to_agency_prospecting_channels.php'
      - 'tests/Feature/Voice/**'
      - 'tests/Js/softphone-*.test.js'
      - 'public/js/crm/mg-softphone.js'
      - 'routes/**'
      - '.github/workflows/agency-byo-voice-tests.yml'

permissions:
  contents: read

concurrency:
  group: agency-byo-voice-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  byo-voice:
    name: Agency BYO Telnyx voice (PHP + MySQL, mocked Telnyx)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ultimatesms_testing
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Choose-A-Local-Test-Password
      EXPECTED_TEST_DATABASE: ultimatesms_testing
      QUEUE_CONNECTION: sync
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Choose-A-Local-Test-Password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
      - name: Softphone JS tests (session switching, reconnect, no stale client)
        run: node --test tests/Js/softphone-inbound.test.js tests/Js/softphone-controls.test.js
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify the BYO voice migration, setup, calling and the existing voice regressions
        run: >-
          php artisan test
          tests/Feature/Voice/AgencyByoVoiceMigrationTest.php
          tests/Feature/Voice/AgencyByoVoiceCallingTest.php
          tests/Feature/Voice/AgencyVoiceSetupTest.php
          tests/Feature/Voice/BrowserCallingTest.php
          tests/Feature/Voice/CustomerOutboundCallTest.php
          tests/Feature/Voice/TelnyxVoiceWebhookTest.php
          tests/Feature/Voice/InboundCallingTest.php
          tests/Feature/Voice/ConversationUnlinkedCallTest.php
          tests/Feature/Voice/SoftphoneShellTest.php
