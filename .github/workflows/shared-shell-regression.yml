name: Shared Shell Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Helpers/Helper.php'
      - 'resources/views/panels/footer.blade.php'
      - 'resources/views/panels/sidebar.blade.php'
      - 'resources/views/layouts/*LayoutMaster.blade.php'
      - 'resources/scss/base/core/layouts/_footer.scss'
      - 'resources/scss/base/core/menu/_navigation.scss'
      - 'resources/js/core/app-menu.js'
      - 'public/js/core/app-menu.js'
      - 'public/css/core.css'
      - 'tests/Feature/Branding/BrandingAdminFooterRenderTest.php'
      - 'tests/Feature/CustomerShell/CustomerShellAccountProfileCleanupTest.php'
      - 'tests/Feature/GoogleAds/Http/AdsBudgetPageTest.php'
      - '.github/workflows/shared-shell-regression.yml'

permissions:
  contents: read

concurrency:
  group: shared-shell-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shell:
    name: Authenticated app shell (PHP + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: ultimatesms_testing
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Choose-A-Local-Test-Password
      EXPECTED_TEST_DATABASE: ultimatesms_testing
      QUEUE_CONNECTION: sync
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Choose-A-Local-Test-Password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Compile Blade views
        run: php artisan view:cache
      - name: Check source and compiled JS syntax
        run: |
          node --check resources/js/core/app-menu.js
          node --check public/js/core/app-menu.js
          php -l app/Helpers/Helper.php
      - name: Run only shared-shell regression tests
        run: >-
          php artisan test
          tests/Feature/Branding/BrandingAdminFooterRenderTest.php
          tests/Feature/CustomerShell/CustomerShellAccountProfileCleanupTest.php
          tests/Feature/GoogleAds/Http/AdsBudgetPageTest.php
          tests/Feature/Navigation/ContextSwitcherTest.php
          tests/Feature/PlatformOwner/PlatformOwnerShellNavigationTest.php
