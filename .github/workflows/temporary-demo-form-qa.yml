# TEMPORARY QA ONLY for manual PR #495. Remove before merge.
# Not part of the autonomous AI subscription loop. No secrets, labels, API calls, or deployments.
name: Temporary Demo Form QA (PR 495)

on:
  push:
    branches:
      - claude/book-demo-design
    paths:
      - .github/workflows/temporary-demo-form-qa.yml

permissions:
  contents: read

jobs:
  focused-demo-qa:
    name: Isolated Laravel demo/form tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP_ENV: testing
      APP_URL: http://localhost
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: ultimatesms_testing_lane_demo495
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Disposable-Demo-495-Only
      EXPECTED_TEST_DATABASE: ultimatesms_testing_lane_demo495
      TARGET_DB: ultimatesms_testing_lane_demo495
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      CACHE_STORE: array
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing_lane_demo495
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Disposable-Demo-495-Only
          MYSQL_ROOT_PASSWORD: Disposable-Root-Demo-495
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify manual branch and environment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/claude/book-demo-design"
          test "$APP_ENV" = "testing"
          test "$DB_DATABASE" = "ultimatesms_testing_lane_demo495"
          test "$EXPECTED_TEST_DATABASE" = "$DB_DATABASE"
          test "$TARGET_DB" = "$DB_DATABASE"
          test "$DB_HOST" = "127.0.0.1"
          test -z "${DATABASE_URL:-}"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, pdo_mysql, intl, xml, curl, zip, gd, exif, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate disposable test DB using repository authority
        shell: bash
        run: |
          set -euo pipefail
          php -r 'require "vendor/autoload.php"; Tests\Support\TestDatabaseSafety::assertSafeTestDatabaseName(getenv("DB_DATABASE"));'

      - name: Migrate the isolated test database
        shell: bash
        run: |
          set -euo pipefail
          php artisan config:clear
          php artisan migrate --force

      - name: Run focused tests sequentially with positive count checks
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for file in \
            tests/Feature/Calendar/DemoFormTest.php \
            tests/Feature/Calendar/DemoBookingTest.php \
            tests/Feature/Marketing/MarketingWebsiteTest.php \
            tests/Feature/PlatformOwner/PlatformOwnerShellNavigationTest.php \
            tests/Feature/Calendar/Zoom/ZoomCalendarUiTest.php
          do
            echo "::group::${file}"
            log="$RUNNER_TEMP/$(basename "$file").log"
            set +e
            php artisan test --no-ansi "$file" > "$log" 2>&1
            result=$?
            set -e
            cat "$log"
            if ! grep -Eq 'Tests:[[:space:]]*[1-9][0-9]*|OK \([1-9][0-9]* tests?' "$log"; then
              echo "::error file=${file}::No positive PHPUnit test count reported."
              failed=1
            fi
            if [ "$result" -ne 0 ]; then
              echo "::error file=${file}::Test command failed with exit status ${result}."
              failed=1
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more focused test suites failed or did not discover tests."
            exit 1
          fi
          echo "All focused suites passed with a positive test count."
