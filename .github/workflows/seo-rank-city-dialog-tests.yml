name: SEO Tracking City Dialog

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Library/Seo/Rank/SeoRankLocationCatalog.php'
      - 'app/Http/Controllers/Customer/Business/SeoRankTargetsController.php'
      - 'resources/views/customer/business/seo/**'
      - 'tests/Feature/Seo/Rank/**'
      - '.github/workflows/seo-rank-city-dialog-tests.yml'

permissions:
  contents: read

concurrency:
  group: seo-rank-city-dialog-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  focused:
    name: SEO tracking city dialog (PHP + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ultimatesms_testing
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Choose-A-Local-Test-Password
      EXPECTED_TEST_DATABASE: ultimatesms_testing
      QUEUE_CONNECTION: sync
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Choose-A-Local-Test-Password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Compile Blade templates
        run: php artisan view:cache
      - name: Run tracking-city dialog, location lookup and keyword page tests
        run: >-
          php artisan test
          tests/Feature/Seo/Rank/SeoRankCityPickerTest.php
          tests/Feature/Seo/Rank/SeoRankHttpTest.php
          tests/Feature/Seo/Rank/SeoRankViewAsTest.php
          tests/Feature/Seo/Rank/SeoKeywordsPageStatesTest.php
          --stop-on-failure
