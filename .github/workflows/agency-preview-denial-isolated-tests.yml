name: Agency Preview Denial — Isolated MySQL Tests
on:
  push:
    branches:
      - ci/agency-preview-denial-focused-20261026
permissions:
  contents: read
jobs:
  agency-preview-tests:
    name: Agency Preview Denial + Agency Site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: ultimatesms_testing
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Choose-A-Local-Test-Password
      BCRYPT_ROUNDS: "4"
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Choose-A-Local-Test-Password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout exact application code and isolated CI workflow
        uses: actions/checkout@v4
      - name: Verify app commit is unchanged
        run: |
          test "$(git rev-parse HEAD^)" = "ca0b472a509f4300f5de90a1f8118f351e5dd52a"
      - name: Configure PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, pdo_mysql, intl, xml, curl, zip
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated MySQL 8 test database
        run: |
          php artisan config:clear
          php artisan migrate --force
      - name: Run exactly the requested focused tests
        run: |
          php artisan test tests/Feature/Agency/AgencySitePreviewDenialTest.php tests/Feature/Agency/AgencySiteTest.php --no-ansi
