name: Outreach Intelligence (analytics, clients, import)

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Library/AgencyOutreach/**'
      - 'app/Console/Commands/Outreach/BackfillImportContactGroups.php'
      - 'app/Models/AgencyProspectGroupLink.php'
      - 'app/Library/CustomFields/**'
      - 'app/Library/AgencyProspecting/AgencyProspectPhoneNormalizer.php'
      - 'app/Http/Controllers/Customer/Workspace/AgencyOutreachAnalyticsController.php'
      - 'app/Http/Controllers/Customer/Workspace/AgencyOutreachClientsController.php'
      - 'app/Http/Controllers/Customer/Workspace/AgencyProspectingController.php'
      - 'app/Models/AgencyProspect.php'
      - 'app/Models/AgencyProspectExclusion.php'
      - 'app/Models/AgencyProspectImportBatch.php'
      - 'app/Models/AgencyProspectImportRow.php'
      - 'database/migrations/2026_12_19_100000_add_outreach_exclusions_imports_and_client_won.php'
      - 'database/migrations/2026_12_20_100000_link_outreach_imports_to_contact_groups.php'
      - 'resources/views/customer/workspaces/prospecting/**'
      - 'public/css/outreach/outreach.css'
      - 'routes/customer.php'
      - 'tests/Feature/AgencyOutreach/OutreachAnalyticsTest.php'
      - 'tests/Feature/AgencyOutreach/OutreachExistingClientsTest.php'
      - 'tests/Feature/AgencyOutreach/OutreachSmartImportTest.php'
      - 'tests/Feature/AgencyOutreach/OutreachImportGroupTest.php'
      - 'tests/Feature/AgencyOutreach/OutreachSingleHeadingTest.php'
      - '.github/workflows/outreach-intelligence-tests.yml'

permissions:
  contents: read

concurrency:
  group: outreach-intelligence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  intelligence:
    name: Analytics, Existing Clients and smart import (PHP + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ultimatesms_testing
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Choose-A-Local-Test-Password
      EXPECTED_TEST_DATABASE: ultimatesms_testing
      QUEUE_CONNECTION: sync
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Choose-A-Local-Test-Password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Test Outreach analytics, exclusions, import and single-heading regressions
        run: php artisan test tests/Feature/AgencyOutreach/OutreachAnalyticsTest.php tests/Feature/AgencyOutreach/OutreachExistingClientsTest.php tests/Feature/AgencyOutreach/OutreachSmartImportTest.php tests/Feature/AgencyOutreach/OutreachImportGroupTest.php tests/Feature/AgencyOutreach/OutreachSingleHeadingTest.php tests/Feature/AgencyOutreach/OutreachRedesignRenderTest.php tests/Feature/AgencyOutreach/OutreachSendPacingTest.php tests/Feature/AgencyOutreach/OutreachReplyTimingTest.php tests/Feature/AgencyOutreach/OutreachEngineTest.php tests/Feature/AgencyOutreach/CampaignContactGroupTest.php --stop-on-failure
