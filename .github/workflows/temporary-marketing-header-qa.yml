# TEMPORARY QA for PR #499: remove before merging.
name: Temporary Marketing Header QA (PR 499)
on:
  push:
    branches:
      - claude/marketing-visual-acceptance
permissions:
  contents: read
jobs:
  marketing:
    name: Isolated marketing regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: testing
      APP_URL: http://localhost
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: ultimatesms_testing_lane_marketing499
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Disposable-Only-Marketing499
      EXPECTED_TEST_DATABASE: ultimatesms_testing_lane_marketing499
      TARGET_DB: ultimatesms_testing_lane_marketing499
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      CACHE_STORE: array
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing_lane_marketing499
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Disposable-Only-Marketing499
          MYSQL_ROOT_PASSWORD: Disposable-Root-Marketing499
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert isolated branch and database
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/claude/marketing-visual-acceptance"
          test "$APP_ENV" = "testing"
          test "$DB_HOST" = "127.0.0.1"
          test "$DB_DATABASE" = "ultimatesms_testing_lane_marketing499"
          test "$EXPECTED_TEST_DATABASE" = "$DB_DATABASE"
          test "$TARGET_DB" = "$DB_DATABASE"
          test -z "${DATABASE_URL:-}"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, pdo_mysql, intl, xml, curl, zip, gd, exif, fileinfo
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate disposable test database
        run: php -r 'require "vendor/autoload.php"; Tests\Support\TestDatabaseSafety::assertSafeTestDatabaseName(getenv("DB_DATABASE"));'
      - name: Migrate isolated database
        run: |
          php artisan config:clear
          php artisan migrate --force
      - name: Marketing website focused test
        shell: bash
        run: |
          set -euo pipefail
          php artisan test --no-ansi tests/Feature/Marketing/MarketingWebsiteTest.php | tee /tmp/marketing499-test.log
          grep -Eq 'Tests:[[:space:]]*[1-9][0-9]* passed|OK \([1-9][0-9]* tests?' /tmp/marketing499-test.log
