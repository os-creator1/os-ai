# TEMPORARY PR #497 isolated test workflow. Remove after QA, before merge.
# This is not the autonomous AI subscription test gate.
name: Temporary Demo Form Fields QA (PR 497)

on:
  push:
    branches:
      - claude/demo-form-protected-fields

permissions:
  contents: read

jobs:
  test:
    name: Isolated Demo Form field and booking regressions
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP_ENV: testing
      APP_URL: http://localhost
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: ultimatesms_testing_lane_demo497
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Disposable-Demo-497-Only
      EXPECTED_TEST_DATABASE: ultimatesms_testing_lane_demo497
      TARGET_DB: ultimatesms_testing_lane_demo497
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      CACHE_STORE: array
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing_lane_demo497
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Disposable-Demo-497-Only
          MYSQL_ROOT_PASSWORD: Disposable-Root-Demo-497
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check branch and DB safety variables
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/claude/demo-form-protected-fields"
          test "$APP_ENV" = "testing"
          test "$DB_HOST" = "127.0.0.1"
          test "$DB_DATABASE" = "ultimatesms_testing_lane_demo497"
          test "$EXPECTED_TEST_DATABASE" = "$DB_DATABASE"
          test "$TARGET_DB" = "$DB_DATABASE"
          test -z "${DATABASE_URL:-}"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, pdo_mysql, intl, xml, curl, zip, gd, exif, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify repository DB safety guard
        shell: bash
        run: |
          set -euo pipefail
          php -r 'require "vendor/autoload.php"; Tests\Support\TestDatabaseSafety::assertSafeTestDatabaseName(getenv("DB_DATABASE"));'

      - name: Migrate disposable MySQL
        shell: bash
        run: |
          set -euo pipefail
          php artisan config:clear
          php artisan migrate --force

      - name: Run targeted tests one suite at a time
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for file in \
            tests/Feature/Calendar/DemoFormTest.php \
            tests/Feature/Calendar/DemoBookingTest.php \
            tests/Feature/Marketing/MarketingWebsiteTest.php \
            tests/Feature/PlatformOwner/PlatformOwnerShellNavigationTest.php \
            tests/Feature/Calendar/PublicBookingTest.php \
            tests/Feature/Calendar/Zoom/ZoomCalendarUiTest.php
          do
            echo "::group::${file}"
            log="$RUNNER_TEMP/$(basename "$file").log"
            set +e
            php artisan test --no-ansi "$file" > "$log" 2>&1
            result=$?
            set -e
            cat "$log"
            if ! grep -Eq 'Tests:[[:space:]]*[1-9][0-9]*|OK \([1-9][0-9]* tests?' "$log"; then
              echo "::error file=${file}::No positive test count reported"
              failed=1
            fi
            if [ "$result" -ne 0 ]; then
              echo "::error file=${file}::Test command returned ${result}"
              failed=1
            fi
            echo "::endgroup::"
          done
          test "$failed" -eq 0
          echo "All targeted suites passed."
