name: Outreach Sequence Continuity

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Library/AgencyOutreach/OutreachSequence.php'
      - 'app/Library/AgencyOutreach/OutreachStageMachine.php'
      - 'app/Library/AgencyOutreach/OutreachReplyComposer.php'
      - 'app/Library/AgencyOutreach/OutreachStepTone.php'
      - 'app/Library/AgencyOutreach/OutreachCampaignDiagnostics.php'
      - 'app/Jobs/Outreach/**'
      - 'app/Listeners/Outreach/**'
      - 'app/Library/AgencyOutreach/OutreachReplyTiming.php'
      - 'app/Library/AgencyOutreach/OutreachScriptManager.php'
      - 'tests/Feature/AgencyOutreach/OutreachReplyTimingTest.php'
      - 'phpunit.xml'
      - 'app/Library/AgencyOutreach/OutreachManualStepFollowUp.php'
      - 'app/Library/AgencyOutreach/OutreachSendPipeline.php'
      - 'app/Library/Conversations/ConversationHistoryWriter.php'
      - 'app/Models/AgencyProspectCampaignMember.php'
      - 'database/migrations/*agency_prospect_campaign_members*'
      - 'tests/Feature/AgencyOutreach/OutreachSequenceContinuityTest.php'
      - '.github/workflows/outreach-sequence-continuity-tests.yml'

permissions:
  contents: read

concurrency:
  group: outreach-sequence-continuity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recipients:
    name: Sequence continuity (PHP + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ultimatesms_testing
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Choose-A-Local-Test-Password
      EXPECTED_TEST_DATABASE: ultimatesms_testing
      QUEUE_CONNECTION: sync
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Choose-A-Local-Test-Password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Test campaign contact-group snapshots and sender eligibility
        run: php artisan test tests/Feature/AgencyOutreach/OutreachReplyTimingTest.php tests/Feature/AgencyOutreach/OutreachSequenceContinuityTest.php tests/Feature/AgencyOutreach/OutreachSequenceV2Test.php tests/Feature/AgencyOutreach/OutreachEngineTest.php tests/Feature/AgencyOutreach/OutreachSafetyTest.php --stop-on-failure
