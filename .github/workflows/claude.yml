name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  # One in-flight Claude run per PR/issue conversation. A newer @claude
  # comment cancels whatever Claude run is still in progress for the same
  # conversation rather than queuing behind it.
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude:
    # Gate 1: the comment must actually contain the trigger phrase.
    # Gate 2: the commenter's association with THIS repository must be
    # OWNER, MEMBER, or COLLABORATOR. An external fork PR's author (or
    # anyone without write access) has an author_association of NONE,
    # CONTRIBUTOR, or FIRST_TIME_CONTRIBUTOR and never satisfies this
    # condition, so this workflow — and this repo's ANTHROPIC_API_KEY —
    # can never be triggered by an untrusted fork user.
    if: |
      contains(github.event.comment.body, '@claude') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
      # Every other permission (checks, deployments, packages, security-events,
      # statuses, etc.) is intentionally omitted, which sets it to "none" for
      # this job rather than defaulting to read.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          claude_args: |
            --model claude-sonnet-5
            --max-turns 8
            --allowedTools "Bash(vendor/bin/phpunit:*),Bash(php artisan test:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Read,Grep,Glob,Edit,Write"
            --disallowedTools "Bash(git push origin main:*),Bash(git push origin master:*),Bash(git push:*main),Bash(git push:*master),Bash(git push --force:*),Bash(git checkout main:*),Bash(git merge:*),Bash(gh pr merge:*),Bash(gh api:*),WebFetch,WebSearch"
            --append-system-prompt "Branch-only development on this repository. Never push to main or master, never merge a pull request, and never force-push — commit only to the branch that triggered this workflow run. For any test run, use the ultimatesms_testing database only; never touch a production-looking database, deployment credential, or unrelated secret. Run the focused tests relevant to the change before any full regression suite. Report exact test counts and the exact git scope (files changed) in your summary."
