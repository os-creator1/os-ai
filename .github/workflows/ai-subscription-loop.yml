name: AI Subscription Loop

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number controlled by the loop
        required: true
        default: "2"
        type: string
      command:
        description: State transition to apply
        required: true
        default: start
        type: choice
        options:
          - start
          - resume
          - pause

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ai-subscription-loop-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  transition:
    name: Move the PR automation state
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out trusted automation code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Self-test the state controller
        run: |
          node .github/scripts/ai_subscription_labels.js --selftest
          node .github/scripts/fire_claude_routine.js --selftest

      - name: Apply the trusted label transition
        id: control
        uses: actions/github-script@v8
        env:
          CONTROL_COMMAND: ${{ inputs.command }}
          CONTROL_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const control = require('./.github/scripts/ai_subscription_labels.js');
            const result = await control({ github, context, core });
            core.setOutput('pr_number', String(result.prNumber ?? ''));
            core.setOutput('status', result.status ?? 'unknown');
            core.setOutput('transition', result.transition ?? '');

            await core.summary
              .addHeading('AI subscription loop')
              .addTable([
                [{ data: 'Field', header: true }, { data: 'Value', header: true }],
                ['PR', String(result.prNumber ?? 'n/a')],
                ['Status', result.status],
                ['Transition', result.transition ?? 'none'],
              ])
              .write();


      - name: Fire the Claude Routine
        id: claude
        if: steps.control.outputs.status == 'transitioned' && contains(steps.control.outputs.transition, '->ai:implement')
        env:
          CLAUDE_ROUTINE_URL: ${{ secrets.CLAUDE_ROUTINE_URL }}
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
        run: node .github/scripts/fire_claude_routine.js

      - name: Stop safely when the Claude Routine cannot start
        if: failure() && steps.control.outputs.status == 'transitioned' && contains(steps.control.outputs.transition, '->ai:implement')
        uses: actions/github-script@v8
        env:
          CONTROL_PR_NUMBER: ${{ steps.control.outputs.pr_number }}
        with:
          script: |
            const prNumber = Number(process.env.CONTROL_PR_NUMBER);
            const managed = [
              'ai:implement', 'ai:testing', 'ai:awaiting-codex',
              'ai:codex-reviewed', 'ai:ready-for-human',
            ];
            for (const label of managed) {
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: prNumber,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: prNumber,
              labels: ['ai:needs-human'],
            });
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: prNumber,
              body: [
                '[AI-SUBSCRIPTION-LOOP NEEDS HUMAN]',
                'The trusted state transition succeeded, but the Claude subscription Routine did not start.',
                `Evidence: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                'No merge action was taken.',
              ].join('\n'),
            });
