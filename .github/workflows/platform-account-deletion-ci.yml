name: Platform Account Deletion CI

# Focused proof for the Platform Owner account deletion/closure lifecycle on a
# disposable MySQL 8 service container with FAKE payment providers (no Stripe,
# no network, no real data). Runs on pushes to the feature branch only; remove
# this file when the branch merges.
on:
  push:
    branches: [feature/platform-account-deletion]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-account-deletion-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    name: Account deletion, Platform Owner, Platform Billing, Agency Billing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: ultimatesms_testing
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Choose-A-Local-Test-Password
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Choose-A-Local-Test-Password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, pdo_mysql, intl, xml, curl, zip, gd, exif, fileinfo
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Database is MySQL 8
        run: mysql -h127.0.0.1 -uultimatesms_test -pChoose-A-Local-Test-Password -e "select version()"

      - name: New account deletion tests
        run: |
          php vendor/bin/phpunit tests/Feature/PlatformOwner/PlatformAccountDeletionTest.php | tee /tmp/new1.log
          php vendor/bin/phpunit tests/Feature/PlatformOwner/PlatformAccountClosureSafetyTest.php | tee /tmp/new2.log
          php vendor/bin/phpunit tests/Feature/PlatformOwner/PlatformAccountDeletionHttpTest.php | tee /tmp/new3.log
          php vendor/bin/phpunit tests/Feature/AgencyBilling/PlatformAccountDeletionAgencyBillingTest.php | tee /tmp/new4.log
          grep -h "^Tests:\|^OK" /tmp/new1.log /tmp/new2.log /tmp/new3.log /tmp/new4.log
          ! grep -L "Tests: [1-9]" /tmp/new1.log /tmp/new2.log /tmp/new3.log /tmp/new4.log | grep .

      - name: Platform Owner regression
        run: php vendor/bin/phpunit tests/Feature/PlatformOwner

      - name: Platform Billing regression
        run: php vendor/bin/phpunit tests/Feature/PlatformBilling

      - name: Agency Billing regression
        run: php vendor/bin/phpunit tests/Feature/AgencyBilling
