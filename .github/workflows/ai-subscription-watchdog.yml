name: AI Subscription Watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-subscription-watchdog.yml"
      - ".github/workflows/ai-subscription-gate.yml"
      - ".github/scripts/ai_subscription_gate.js"
      - "docs/automation/AI-AUTONOMY-STATE.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: ai-subscription-watchdog
  cancel-in-progress: true

jobs:
  recover-stranded-gate:
    name: Recover a stranded testing state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the deterministic gate when needed
        uses: actions/github-script@v8
        with:
          script: |
            const path = 'docs/automation/AI-AUTONOMY-STATE.json';
            const { data: file } = await github.rest.repos.getContent({
              ...context.repo,
              path,
              ref: context.payload.repository.default_branch,
            });
            if (Array.isArray(file) || file.type !== 'file' || !file.content) {
              core.setFailed('Locked automation state is not a readable file.');
              return;
            }
            const state = JSON.parse(
              Buffer.from(file.content, file.encoding || 'base64').toString('utf8')
            );
            if (state.repository !== context.repo.owner + '/' + context.repo.repo) {
              core.setFailed('Locked automation state targets another repository.');
              return;
            }

            const prNumber = Number(state.active_pull_request);
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            });
            if (
              pr.state !== 'open'
              || pr.base.ref !== state.base_branch
              || pr.head.ref !== state.head_branch
              || pr.head.repo.full_name !== state.repository
            ) {
              core.setFailed('Locked automation target no longer matches the active pull request.');
              return;
            }

            const labels = new Set(pr.labels.map((label) => label.name));
            if (!labels.has(state.gate_label)) {
              core.notice('The active pull request is not waiting at the deterministic gate.');
              return;
            }
            if (labels.has('ai:paused') || labels.has(state.failure_label)) {
              core.notice('Automation is paused or already needs human attention.');
              return;
            }

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'ai-subscription-gate.yml',
              per_page: 50,
            });
            const active = runs.workflow_runs.find((run) => run.status !== 'completed');
            if (active) {
              core.notice(`Gate run ${active.id} is already ${active.status}.`);
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'ai-subscription-gate.yml',
              ref: state.base_branch,
              inputs: { pr_number: String(prNumber) },
            });
            core.notice(`Dispatched the gate for PR #${prNumber} at ${pr.head.sha}.`);
