name: AI Subscription Watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-subscription-watchdog.yml"
      - ".github/workflows/ai-subscription-gate.yml"
      - ".github/scripts/ai_subscription_gate.js"
      - "docs/automation/AI-AUTONOMY-STATE.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-subscription-watchdog
  cancel-in-progress: true

jobs:
  recover-stranded-gate:
    name: Recover a stranded testing state
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Dispatch the deterministic gate or consume a trusted override
        id: recover
        uses: actions/github-script@v8
        with:
          script: |
            const path = 'docs/automation/AI-AUTONOMY-STATE.json';
            const { data: file } = await github.rest.repos.getContent({
              ...context.repo,
              path,
              ref: context.payload.repository.default_branch,
            });
            if (Array.isArray(file) || file.type !== 'file' || !file.content) {
              core.setFailed('Locked automation state is not a readable file.');
              return;
            }
            const state = JSON.parse(
              Buffer.from(file.content, file.encoding || 'base64').toString('utf8')
            );
            if (state.repository !== context.repo.owner + '/' + context.repo.repo) {
              core.setFailed('Locked automation state targets another repository.');
              return;
            }

            const prNumber = Number(state.active_pull_request);
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            });
            if (
              pr.state !== 'open'
              || pr.base.ref !== state.base_branch
              || pr.head.ref !== state.head_branch
              || pr.head.repo.full_name !== state.repository
            ) {
              core.setFailed('Locked automation target no longer matches the active pull request.');
              return;
            }

            const labels = new Set(pr.labels.map((label) => label.name));
            if (labels.has('ai:paused')) {
              core.notice('Automation is paused.');
              return;
            }
            if (labels.has(state.failure_label)) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: prNumber,
                per_page: 100,
              });
              const override = [...comments].reverse().find((comment) =>
                comment.user?.login === context.repo.owner
                && comment.body?.includes('[AI-SUBSCRIPTION-LOOP HUMAN OVERRIDE]')
                && comment.body?.includes(`before_sha: \`${pr.head.sha}\``)
              );
              if (!override) {
                core.notice('Human attention is required and no trusted current-head override exists.');
                return;
              }
              const consumed = comments.some((comment) =>
                comment.user?.login === 'github-actions[bot]'
                && comment.body?.includes('[AI-SUBSCRIPTION-LOOP OVERRIDE CONSUMED]')
                && comment.body?.includes(`override_comment: ${override.id}`)
              );
              if (consumed) {
                core.notice(`Trusted override comment ${override.id} was already consumed.`);
                return;
              }
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body: [
                  '[AI-SUBSCRIPTION-LOOP OVERRIDE CONSUMED]',
                  `override_comment: ${override.id}`,
                  `before_sha: \`${pr.head.sha}\``,
                  'One bounded Claude correction run was authorized. No merge action was taken.',
                ].join('\\n'),
              });
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: prNumber,
                name: state.failure_label,
              });
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: prNumber,
                labels: ['ai:codex-reviewed'],
              });
              core.setOutput('fire_claude', 'true');
              core.setOutput('pr_number', String(prNumber));
              core.setOutput('head_sha', pr.head.sha);
              core.notice(`Consumed trusted override comment ${override.id} for ${pr.head.sha}.`);
              return;
            }
            if (!labels.has(state.gate_label)) {
              core.notice('The active pull request is not waiting at the deterministic gate.');
              return;
            }

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'ai-subscription-gate.yml',
              per_page: 50,
            });
            const active = runs.workflow_runs.find((run) => run.status !== 'completed');
            if (active) {
              core.notice(`Gate run ${active.id} is already ${active.status}.`);
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'ai-subscription-gate.yml',
              ref: state.base_branch,
              inputs: { pr_number: String(prNumber) },
            });
            core.notice(`Dispatched the gate for PR #${prNumber} at ${pr.head.sha}.`);

      - name: Check out the trusted Routine trigger
        if: steps.recover.outputs.fire_claude == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate and fire Claude for the trusted override
        if: steps.recover.outputs.fire_claude == 'true'
        env:
          CLAUDE_ROUTINE_URL: ${{ secrets.CLAUDE_ROUTINE_URL }}
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
        run: |
          node .github/scripts/fire_claude_routine.js --selftest
          node .github/scripts/fire_claude_routine.js

      - name: Follow the override Routine and dispatch its returned head
        if: steps.recover.outputs.fire_claude == 'true' && success()
        timeout-minutes: 45
        uses: actions/github-script@v8
        env:
          CONTROL_PR_NUMBER: ${{ steps.recover.outputs.pr_number }}
          CONTROL_HEAD_SHA: ${{ steps.recover.outputs.head_sha }}
        with:
          script: |
            const prNumber = Number(process.env.CONTROL_PR_NUMBER);
            const originalHead = process.env.CONTROL_HEAD_SHA;
            const deadline = Date.now() + (44 * 60 * 1000);
            while (Date.now() < deadline) {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: prNumber,
              });
              const labels = new Set(pr.labels.map((label) => label.name));
              if (labels.has('ai:ready-for-human')) {
                core.notice('Claude finalized the override head without another correction.');
                return;
              }
              if (labels.has('ai:needs-human') || labels.has('ai:paused')) {
                core.setFailed('Claude stopped safely and requested human attention.');
                return;
              }
              if (pr.head.sha !== originalHead && labels.has('ai:testing')) {
                await github.rest.actions.createWorkflowDispatch({
                  ...context.repo,
                  workflow_id: 'ai-subscription-gate.yml',
                  ref: context.payload.repository.default_branch,
                  inputs: { pr_number: String(prNumber) },
                });
                core.notice(`Dispatched the returned override head ${pr.head.sha}.`);
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            core.setFailed('Claude did not return an override correction within forty-four minutes.');

      - name: Stop safely if the override Routine cannot start
        if: failure() && steps.recover.outputs.fire_claude == 'true'
        uses: actions/github-script@v8
        env:
          CONTROL_PR_NUMBER: ${{ steps.recover.outputs.pr_number }}
        with:
          script: |
            const prNumber = Number(process.env.CONTROL_PR_NUMBER);
            try {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: prNumber,
                name: 'ai:codex-reviewed',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: prNumber,
              labels: ['ai:needs-human'],
            });
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: prNumber,
              body: [
                '[AI-SUBSCRIPTION-LOOP NEEDS HUMAN]',
                'The trusted override was accepted, but the Claude Routine did not start.',
                `Evidence: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                'No merge action was taken.',
              ].join('\\n'),
            });
