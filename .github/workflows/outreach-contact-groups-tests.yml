name: Outreach Contact Group Recipients

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Library/AgencyOutreach/OutreachContactGroupBridge.php'
      - 'app/Library/AgencyOutreach/OutreachEligibility.php'
      - 'app/Library/AgencyOutreach/OutreachCampaignService.php'
      - 'app/Listeners/Outreach/HandleOutreachInboundMessage.php'
      - 'app/Enums/AgencyProspecting/AgencyProspectCampaignStatus.php'
      - 'routes/customer.php'
      - 'app/Http/Controllers/Customer/Workspace/AgencyOutreachController.php'
      - 'app/Http/Controllers/Customer/Workspace/AgencyProspectingController.php'
      - 'app/Models/AgencyProspectCampaign.php'
      - 'app/Models/AgencyProspectCampaignMember.php'
      - 'resources/views/customer/workspaces/prospecting/campaigns.blade.php'
      - 'resources/views/customer/workspaces/prospecting/campaign-show.blade.php'
      - 'database/migrations/2026_11_24_090000_add_contact_group_source_to_agency_prospecting.php'
      - 'tests/Feature/AgencyOutreach/CampaignContactGroupTest.php'
      - 'tests/Feature/AgencyOutreach/EndCampaignTest.php'
      - '.github/workflows/outreach-contact-groups-tests.yml'

permissions:
  contents: read

concurrency:
  group: outreach-group-recipients-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recipients:
    name: Campaign recipient bridge (PHP + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ultimatesms_testing
      DB_USERNAME: ultimatesms_test
      DB_PASSWORD: Choose-A-Local-Test-Password
      EXPECTED_TEST_DATABASE: ultimatesms_testing
      QUEUE_CONNECTION: sync
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ultimatesms_testing
          MYSQL_USER: ultimatesms_test
          MYSQL_PASSWORD: Choose-A-Local-Test-Password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Test campaign contact-group snapshots and sender eligibility
        run: php artisan test tests/Feature/AgencyOutreach/CampaignContactGroupTest.php tests/Feature/AgencyOutreach/EndCampaignTest.php tests/Feature/AgencyOutreach/OutreachSafetyTest.php --stop-on-failure
